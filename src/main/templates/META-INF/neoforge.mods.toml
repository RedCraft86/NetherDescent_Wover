modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="${mod_id}.mixins.json"

[modproperties.${mod_id}]
catalogueImageIcon="${mod_id}_icon.png"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
authors="${mod_author}, ${mod_credits}"
displayURL="https://github.com/${mod_author}/${repo_name}"
issueTrackerURL="https://github.com/${mod_author}/${repo_name}/issues"
logoFile="${mod_id}_icon.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="wover"
type="required"
versionRange="[${wover_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="netherdescent"
type="required"
versionRange="[${descent_version},)"
ordering="NONE"
side="BOTH"
